name: Deploy CARDIO4Cities frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure backend URL
        env:
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}
        run: printf 'window.CARDIO_API_BASE = "%s";\n' "$BACKEND_API_URL" > frontend/runtime-config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4